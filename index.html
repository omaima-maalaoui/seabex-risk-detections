<!DOCTYPE html>
<html><head><title>Seabex Risk Detection</title></head>
<body style="font-family:Arial;background:#eef4f1;padding:25px">
<h1>🌱 Seabex Risk Detection</h1>
<label>Soil Moisture (%)</label><input id="m" type="number" value="15">
<label>Temperature (°C)</label><input id="t" type="number" value="38">
<label>Rainfall (mm)</label><input id="r" type="number" value="17">
<button onclick="let m=+document.getElementById('m').value,t=+document.getElementById('t').value,r=+document.getElementById('r').value,s=Math.min(100,Math.round(Math.max(0,(25-m)*3)+Math.max(0,t-25)*2+Math.max(0,20-r)*1.5)),risk=s>=60?'HIGH RISK':s>=30?'MEDIUM RISK':'LOW RISK';document.getElementById('result').innerHTML='<h2>'+risk+'</h2><h1>'+s+'% Risk</h1>'">Analyze Risk</button>
<div id="result"></div></body></html>
