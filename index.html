<!DOCTYPE html>
<html><head><title>Seabex Risk Detection</title><style>body{font-family:Arial;background:#eef4f1;padding:25px}.box{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}input,button{width:100%;padding:12px;margin:10px 0;box-sizing:border-box}button{background:#176b45;color:white;border:0}#result{padding:15px;margin-top:15px}</style></head>
<body><div class="box"><h1>🌱 Seabex Risk Detection</h1><p>Agricultural Risk Monitoring</p>
<label>Soil Moisture (%)</label><input id="m" type="number" value="15">
<label>Temperature (°C)</label><input id="t" type="number" value="38">
<label>Rainfall (mm)</label><input id="r" type="number" value="0">
<button onclick="analyze()">Analyze Risk</button><div id="result"></div></div>
<script>
function analyze(){let m=+document.getElementById('m').value,t=+document.getElementById('t').value,r=+document.getElementById('r').value,o=document.getElementById('result');if(!document.getElementById('m').value||!document.getElementById('t').value||!document.getElementById('r').value||m<0||m>100||t< -10||t>60||r<0){o.innerHTML="Enter valid values";return;}let s=Math.min(100,Math.round(Math.max(0,(25-m)*3)+Math.max(0,t-25)*2+Math.max(0,20-r)*1.5)),risk=s>=60?"HIGH RISK":s>=30?"MEDIUM RISK":"LOW RISK";o.innerHTML=`<h2>${risk}</h2><h1>${s}% Risk</h1>`;o.style.background=s>=60?"#ffe0e0":s>=30?"#fff0d5":"#d9f5e5";}
</script></body></html>
